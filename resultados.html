<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Vitriol Inmobiliaria</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="navbar">
        <a href="./index.html"><img src="./recursos/ChatGPT Image 12 mar 2026, 19_04_04.png" alt="LOGO"></a>
    </header>

    <main class="pagina-resultados">
        <section class="seccion-resultados">
            <h2>Propiedades disponibles</h2>

            <div class="barra-busqueda">
                <select id="filtroOperacion">
                    <option value="">Operación</option>
                </select>

                <select id="filtroTipo">
                    <option value="">Tipo</option>
                </select>

                <select id="filtroDormitorios">
                    <option value="">Dormitorios</option>
                    <option value="1">1 o más</option>
                    <option value="2">2 o más</option>
                    <option value="3">3 o más</option>
                    <option value="4">4 o más</option>
                </select>

                <input type="number" id="filtroPrecioMin" placeholder="Precio Mín." style="width: 100px;">
                <input type="number" id="filtroPrecioMax" placeholder="Precio Máx." style="width: 100px;">

                <div class="buscador-barrio" style="flex: 2; position: relative;">
                    <input type="text" id="filtroBarrio" placeholder="Buscar barrio" autocomplete="off"
                        style="width: 100%; height: 100%;">
                    <div id="sugerenciasBarrios"></div>
                </div>
            </div>

            <div id="contenedorResultados" class="grid-propiedades"></div>

            <div id="contenedorPaginacion" class="paginacion-container"></div>

        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="./recursos/ChatGPT Image 12 mar 2026, 19_04_04.png" alt="Vitriol">
            </div>
            <div class="footer-info">
                <div class="info-item">
                    <span class="icon">📍</span>
                    <p>Av Falsa 123, Córdoba</p>
                </div>
                <div class="info-item">
                    <span class="icon">📞</span>
                    <p>351 555 5555</p>
                </div>
                <div class="info-item">
                    <span class="icon">💬</span>
                    <p>351 555 5555</p>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>www.vitriol.com</p>
            <div class="footer-redes">
                <span>f</span>
                <span>📷</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/resultados.js"></script>
</body>

</html>
